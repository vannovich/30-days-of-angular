<div class="posts">
  <!-- Loading -->
  <div class="loading" *ngIf="loading">
    Loading...
  </div>

  <!-- Error -->
  <div class="error-message" *ngIf="!loading && errorMessage">
    {{ errorMessage }}
  </div>

  <!-- Posts -->
  <ng-container *ngIf="!loading && !errorMessage">
    <app-post
      *ngFor="let post of posts"
      [post]="post">
    </app-post>
  </ng-container>
</div>
