<div class="container">
  <h1 class="title">Documnt List Filter</h1>
  <input
    type="text"
    placeholder="search tutorials..."
    [(ngModel)]="searchText"
    class="forms-control search-box"
  />

  <ul class="list-group">
    <li *ngFor="let item of items | filter : searchText" class="list-group-item">{{ item }}</li>
  </ul>
</div>
