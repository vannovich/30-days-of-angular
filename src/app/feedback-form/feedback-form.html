<div class="form-container">
  <h2>Feedback Form</h2>

  <form #feedbackForm="ngForm" (ngSubmit)="onSubmit(feedbackForm)">

    <!-- Name -->
    <div class="form-group">
      <label for="name">Name:</label>
      <input
        type="text"
        id="name"
        name="name"
        autocomplete="off"
        [(ngModel)]="feedback.name"
        #nameCtrl="ngModel"
        required
      />
      <div class="error" *ngIf="nameCtrl.invalid && nameCtrl.touched">
        Name is required
      </div>
    </div>

    <!-- Email -->
    <div class="form-group">
      <label for="email">Email:</label>
      <input
        type="email"
        id="email"
        name="email"
        autocomplete="off"
        [(ngModel)]="feedback.email"
        #emailCtrl="ngModel"
        required
        email
      />
      <div class="error" *ngIf="emailCtrl.invalid && emailCtrl.touched">
        <div *ngIf="emailCtrl.errors?.['required']">Email is required</div>
        <div *ngIf="emailCtrl.errors?.['email']">Invalid email format</div>
      </div>
    </div>

    <!-- Feedback -->
    <div class="form-group">
      <label for="feedback">Feedback:</label>
      <textarea
        id="feedback"
        name="feedback"
        autocomplete="off"
        [(ngModel)]="feedback.feedback"
        #feedbackCtrl="ngModel"
        required
      ></textarea>
      <div class="error" *ngIf="feedbackCtrl.invalid && feedbackCtrl.touched">
        Feedback is required
      </div>
    </div>

    <!-- Submit -->
    <button type="submit" [disabled]="feedbackForm.invalid">
      Submit Feedback
    </button>
  </form>

  <!-- Success Message -->
  <div class="success" *ngIf="submitted">
    <h3>Thank you for your feedback, {{feedback.name}}</h3>
    <p>We will get back to you at {{feedback.email}} if necessary</p>
  </div>
</div>
