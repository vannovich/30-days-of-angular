<div class="joke-container">
  <h2>Random Joke Generator</h2>
  <button (click)="fetchJoke()">Get Random Joke</button>

  <div class="loading" *ngIf="isLoading">Loading...</div>
  <div *ngIf="errorMessage" class="error">{{errorMessage}}</div>

  <div *ngIf="jokeSetup && !isLoading && !errorMessage">
    <p>
      Setup: <strong>{{ jokeSetup }}</strong>
    </p>
    <p>
      Punchline: <strong>{{ jokePunchline }}</strong>
    </p>
  </div>
</div>
