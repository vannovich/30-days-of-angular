<div class="todo-container">
  <h2>To-Do List</h2>

  <input type="text" [(ngModel)]="newTask" placeholder="Enter new todo" (keyup.enter)="addNewTask()"/>

  <button (click)="addNewTask()">Add Task</button>
  <p *ngIf="tasks.length === 0">No task available. Add a new task</p>
  <ul>
    <li *ngFor="let task of tasks; let i = index">
      {{task}} <button (click)="removeTask(i)">remove</button>
    </li>
  </ul>
</div>
